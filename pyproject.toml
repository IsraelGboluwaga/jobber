[project]
name = "jobber"
version = "0.1.0"
description = "Lightweight scheduled daily job-search pipeline (no server, no UI)."
requires-python = ">=3.11"
dependencies = [
    "python-jobspy>=1.1.80",   # consumer boards (LinkedIn/Indeed/Glassdoor/Google/ZipRecruiter)
    "openai>=1.40.0",          # OpenAI-compatible client, pointed at DeepSeek
    "notion-client>=2.2.1",    # official Notion SDK for Python
    "requests>=2.31.0",        # ntfy POST
    "PyYAML>=6.0",             # config.yaml
    "python-dotenv>=1.0.0",    # local .env loading (no-op in CI)
]

[tool.uv]
# This is an application, not an installable library — don't try to build/install
# the project itself; uv just manages the venv and dependencies. The code runs
# via `uv run python -m src.main`.
package = false
