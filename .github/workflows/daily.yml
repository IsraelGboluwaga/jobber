name: daily-job-search

on:
  schedule:
    # 04:00 UTC = 05:00 Africa/Lagos (UTC+1) — ready by morning in Nigeria.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# A new run cancels an unfinished previous one instead of both burning tokens.
concurrency:
  group: daily-job-search
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a hung run dies on its own
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen        # uses the committed uv.lock

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m src.main
